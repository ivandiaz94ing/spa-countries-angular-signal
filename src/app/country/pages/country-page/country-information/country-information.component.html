<div class="min-h-screen bg-base-200 p-4 md:p-10 flex justify-center items-start">

  @if (country(); as countryData) {

    <div class="card w-full max-w-2xl bg-base-100 shadow-xl overflow-hidden">

      <figure class="bg-base-300 p-6 sm:p-10">
        <img
          [src]="countryData.flagSvg"
          [alt]="'Bandera de ' + countryData.name"
          class="rounded-lg shadow-md max-h-60 w-full object-contain border border-base-300" />
      </figure>

      <div class="card-body p-6 sm:p-8">

        <h1 class="card-title text-3xl md:text-5xl justify-center mb-6">
          {{ countryData.name }}
        </h1>

        <div class="stats stats-vertical lg:stats-horizontal shadow w-full">

          <div class="stat">
            <div class="stat-title text-lg">Población</div>
            <div class="stat-value text-primary text-3xl">
              {{ countryData.population | number }}
            </div>
            <div class="stat-desc">Habitantes</div>
          </div>

          <div class="stat">
            <div class="stat-title text-lg">Capital</div>

            @if (countryData.capital.length > 0) {
              <div class="stat-value text-secondary text-3xl">
                {{ countryData.capital.join(', ') }}
              </div>
            } @else {
              <div class="stat-value text-base-content text-opacity-50">
                N/A
              </div>
            }
          </div>

        </div>
      </div>
    </div>

  } 

</div>
