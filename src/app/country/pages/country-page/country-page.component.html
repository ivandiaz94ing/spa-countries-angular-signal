@if(countryResource.error()){
  <app-not-found/>
}

@if(countryResource.isLoading()){
  <!-- <h1 class="text-3xl">Cargando...</h1> -->
<section class="flex flex-row items-center justify-center mt-10">

  <span class="loading loading-ring loading-xs"></span>
  <span class="loading loading-ring loading-sm"></span>
  <span class="loading loading-ring loading-md"></span>
  <span class="loading loading-ring loading-lg"></span>
  <span class="loading loading-ring loading-xl"></span>
</section>

}


@if(countryResource.hasValue()){
  <country-information [country]="countryResource.value()"/>
}
